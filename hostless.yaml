# No-card, free-allowance deployment target. This deliberately keeps each
# long-running process within the documented free resource deduction.
build:
  system: docker

# Build the existing backend image from its own context. It already installs
# Tesseract, runs as an unprivileged user, and listens on Hostless's PORT.
working_directory: backend
build_context_directory: backend
dockerfile_path: Dockerfile

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 256
  max_memory: 256
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: /health/live
  interval_in_seconds: 10

# Keep the durable PostgreSQL-backed queue on its own process. It uses the
# same image/configuration as the API and remains a single replica.
workers:
  - name: case-processing
    command: python -m app.worker
    min_cpu_per_replica: 0.1
    max_cpu_per_replica: 0.1
    min_memory_per_replica: 256
    max_memory_per_replica: 256
    replicas: 1
