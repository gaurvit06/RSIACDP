services:
  db:
    image: rsaicdp-postgres:16.15-alpine3.24
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_intel}
      POSTGRES_USER: ${POSTGRES_USER:-recruitment_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [casework]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitment_intel} -d ${POSTGRES_DB:-recruitment_intel}"]
      interval: 5s
      timeout: 3s
      retries: 15

  neo4j:
    image: neo4j:5.26.33-community-trixie
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting Compose}
    volumes:
      - neo4j_data:/data
    networks: [casework]
    healthcheck:
      test: ["CMD-SHELL", "auth=\"$$NEO4J_AUTH\"; user=\"$${auth%%/*}\"; password=\"$${auth#*/}\"; cypher-shell -a bolt://localhost:7687 -u \"$$user\" -p \"$$password\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-recruitment_intel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@db:5432/${POSTGRES_DB:-recruitment_intel}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Compose}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-20}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/private_uploads}
      UPLOAD_ENCRYPTION_KEY: ${UPLOAD_ENCRYPTION_KEY:?Set UPLOAD_ENCRYPTION_KEY in .env before starting Compose}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-180}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      REGISTER_MAX_REQUESTS: ${REGISTER_MAX_REQUESTS:-20}
      REGISTER_WINDOW_SECONDS: ${REGISTER_WINDOW_SECONDS:-900}
      REGISTER_LOCKOUT_SECONDS: ${REGISTER_LOCKOUT_SECONDS:-900}
      CORRECTION_MAX_REQUESTS: ${CORRECTION_MAX_REQUESTS:-10}
      CORRECTION_WINDOW_SECONDS: ${CORRECTION_WINDOW_SECONDS:-900}
      CORRECTION_LOCKOUT_SECONDS: ${CORRECTION_LOCKOUT_SECONDS:-900}
      CAMPAIGN_LINK_THRESHOLD: ${CAMPAIGN_LINK_THRESHOLD:-40}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1,${CADDY_PROXY_IP:-172.30.0.10},${WEB_PROXY_IP:-172.30.0.11}}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting Compose}
      RDAP_ENABLED: ${RDAP_ENABLED:-false}
      RDAP_TIMEOUT_SECONDS: ${RDAP_TIMEOUT_SECONDS:-5}
      RDAP_MAX_RESPONSE_BYTES: ${RDAP_MAX_RESPONSE_BYTES:-1048576}
      INITIAL_INVESTIGATOR_CODE: ${INITIAL_INVESTIGATOR_CODE:?Set INITIAL_INVESTIGATOR_CODE in .env before starting Compose}
      INITIAL_REVIEWER_CODE: ${INITIAL_REVIEWER_CODE:?Set INITIAL_REVIEWER_CODE in .env before starting Compose}
    volumes:
      - private_uploads:/app/private_uploads
    networks: [casework]
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-recruitment_intel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@db:5432/${POSTGRES_DB:-recruitment_intel}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Compose}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/private_uploads}
      UPLOAD_ENCRYPTION_KEY: ${UPLOAD_ENCRYPTION_KEY:?Set UPLOAD_ENCRYPTION_KEY in .env before starting Compose}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-180}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      REGISTER_MAX_REQUESTS: ${REGISTER_MAX_REQUESTS:-20}
      REGISTER_WINDOW_SECONDS: ${REGISTER_WINDOW_SECONDS:-900}
      REGISTER_LOCKOUT_SECONDS: ${REGISTER_LOCKOUT_SECONDS:-900}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting Compose}
      RDAP_ENABLED: ${RDAP_ENABLED:-false}
      RDAP_TIMEOUT_SECONDS: ${RDAP_TIMEOUT_SECONDS:-5}
      RDAP_MAX_RESPONSE_BYTES: ${RDAP_MAX_RESPONSE_BYTES:-1048576}
    volumes:
      - private_uploads:/app/private_uploads
    networks: [casework]
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from app.db import engine; c=engine.connect(); c.execute(text('SELECT 1')); c.close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL-}
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "${WEB_BIND:-127.0.0.1}:5173:80"
    networks:
      casework:
        ipv4_address: ${WEB_PROXY_IP:-172.30.0.11}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.11.9-alpine
    profiles: ["production"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-example.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      casework:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.0.10}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  private_uploads:
  caddy_data:
  caddy_config:

networks:
  casework:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
