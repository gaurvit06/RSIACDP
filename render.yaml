# $0 deployment configuration. This Blueprint intentionally creates exactly
# one Free web service; it does not create a paid worker, private service,
# Neo4j instance, persistent disk, or managed database.
services:
  - type: web
    name: rsiacdp-api
    runtime: docker
    plan: free
    region: singapore
    branch: codex/initial-platform
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: UPLOAD_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: private-evidence
      - key: DATA_RETENTION_DAYS
        value: "180"
      - key: RDAP_ENABLED
        value: "false"
      - key: FORWARDED_ALLOW_IPS
        # Keep proxy headers untrusted until the actual Render/Vercel chain is verified.
        value: 127.0.0.1
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_INVESTIGATOR_CODE
        generateValue: true
      - key: INITIAL_REVIEWER_CODE
        generateValue: true
