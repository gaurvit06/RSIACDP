# Temporary, file-scoped exception for an upstream Caddy module finding.
# Re-review when the official Caddy build updates golang.org/x/net or by expiry.
vulnerabilities:
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    expired_at: 2027-02-12
    statement: >-
      Caddy 2.11.9 bundles golang.org/x/net v0.60.0; Trivy reports a finding
      in x/net/html fixed in v0.62.0. The production Caddyfile uses only
      reverse_proxy, headers, and compression; it does not enable HTML templates.
      Recheck on upstream Caddy release or by expiry.
