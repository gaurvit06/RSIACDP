version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /database
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
